<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="petalGrad1">
      <stop offset="0%" stop-color="#FFE5EC"/>
      <stop offset="100%" stop-color="#FFB6C1"/>
    </radialGradient>
    <radialGradient id="petalGrad2">
      <stop offset="0%" stop-color="#F0E6FF"/>
      <stop offset="100%" stop-color="#C8A2C8"/>
    </radialGradient>
  </defs>
  
  <!-- Vine -->
  <path d="M 0 0 Q 40 40 60 80 Q 80 120 140 150" stroke="#B2D8B2" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 0 0 Q 50 30 90 40 Q 130 50 160 90" stroke="#B2D8B2" stroke-width="1.5" fill="none" opacity="0.5"/>
  
  <!-- Leaves -->
  <ellipse cx="45" cy="45" rx="10" ry="5" fill="#B2D8B2" opacity="0.5" transform="rotate(45 45 45)"/>
  <ellipse cx="90" cy="60" rx="10" ry="5" fill="#B2D8B2" opacity="0.5" transform="rotate(-30 90 60)"/>
  <ellipse cx="120" cy="130" rx="10" ry="5" fill="#B2D8B2" opacity="0.4" transform="rotate(60 120 130)"/>
  
  <!-- Main flower -->
  <g transform="translate(40, 40)">
    <ellipse cx="0" cy="-14" rx="8" ry="14" fill="url(#petalGrad1)"/>
    <ellipse cx="0" cy="14" rx="8" ry="14" fill="url(#petalGrad1)"/>
    <ellipse cx="-14" cy="0" rx="14" ry="8" fill="url(#petalGrad2)"/>
    <ellipse cx="14" cy="0" rx="14" ry="8" fill="url(#petalGrad2)"/>
    <ellipse cx="-10" cy="-10" rx="8" ry="14" fill="url(#petalGrad1)" transform="rotate(-45 0 0)"/>
    <ellipse cx="10" cy="10" rx="8" ry="14" fill="url(#petalGrad1)" transform="rotate(-45 0 0)"/>
    <ellipse cx="10" cy="-10" rx="8" ry="14" fill="url(#petalGrad2)" transform="rotate(45 0 0)"/>
    <ellipse cx="-10" cy="10" rx="8" ry="14" fill="url(#petalGrad2)" transform="rotate(45 0 0)"/>
    <circle cx="0" cy="0" r="6" fill="#FFF5E1"/>
    <circle cx="0" cy="0" r="3" fill="#FFD700" opacity="0.7"/>
  </g>
  
  <!-- Small flower -->
  <g transform="translate(130, 130)">
    <circle cx="0" cy="-8" r="5" fill="#FFB6C1"/>
    <circle cx="0" cy="8" r="5" fill="#FFB6C1"/>
    <circle cx="-8" cy="0" r="5" fill="#FFB6C1"/>
    <circle cx="8" cy="0" r="5" fill="#FFB6C1"/>
    <circle cx="0" cy="0" r="3" fill="#FFF5E1"/>
  </g>
  
  <!-- Tiny buds -->
  <circle cx="80" cy="100" r="4" fill="#FFB6C1" opacity="0.7"/>
  <circle cx="100" cy="70" r="3" fill="#C8A2C8" opacity="0.7"/>
</svg>
