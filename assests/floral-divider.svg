<svg width="800" height="60" viewBox="0 0 800 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB6C1"/>
      <stop offset="50%" stop-color="#C8A2C8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  
  <!-- Center line -->
  <line x1="0" y1="30" x2="800" y2="30" stroke="url(#petalGrad)" stroke-width="1" opacity="0.4"/>
  
  <!-- Left vine -->
  <path d="M 100 30 Q 150 10 200 30 Q 250 50 300 30" stroke="url(#petalGrad)" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 100 30 Q 150 50 200 30 Q 250 10 300 30" stroke="url(#petalGrad)" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- Right vine -->
  <path d="M 500 30 Q 550 10 600 30 Q 650 50 700 30" stroke="url(#petalGrad)" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 500 30 Q 550 50 600 30 Q 650 10 700 30" stroke="url(#petalGrad)" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- Center flower -->
  <g transform="translate(400, 30)">
    <ellipse cx="0" cy="-10" rx="4" ry="8" fill="#FFB6C1" opacity="0.9"/>
    <ellipse cx="0" cy="10" rx="4" ry="8" fill="#FFB6C1" opacity="0.9"/>
    <ellipse cx="-10" cy="0" rx="8" ry="4" fill="#C8A2C8" opacity="0.9"/>
    <ellipse cx="10" cy="0" rx="8" ry="4" fill="#C8A2C8" opacity="0.9"/>
    <ellipse cx="-7" cy="-7" rx="4" ry="8" fill="#A78BFA" opacity="0.8" transform="rotate(-45 0 0)"/>
    <ellipse cx="7" cy="7" rx="4" ry="8" fill="#A78BFA" opacity="0.8" transform="rotate(-45 0 0)"/>
    <circle cx="0" cy="0" r="3" fill="#FFF5E1"/>
  </g>
  
  <!-- Small flowers along vine -->
  <g transform="translate(200, 30)">
    <circle cx="0" cy="0" r="3" fill="#FFB6C1"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF5E1"/>
  </g>
  <g transform="translate(600, 30)">
    <circle cx="0" cy="0" r="3" fill="#A78BFA"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF5E1"/>
  </g>
  
  <!-- Leaf accents -->
  <path d="M 150 30 Q 160 20 170 30 Q 160 40 150 30 Z" fill="#B2D8B2" opacity="0.7"/>
  <path d="M 630 30 Q 640 20 650 30 Q 640 40 630 30 Z" fill="#B2D8B2" opacity="0.7"/>
</svg>
