<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1B4E"/>
      <stop offset="50%" stop-color="#6B2D5C"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#FFB6C1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFB6C1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="1200" height="220" fill="url(#sky)"/>
  
  <!-- Twinkling stars -->
  <circle cx="100" cy="40" r="1.5" fill="#FFF5E1">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="70" r="1.5" fill="#FFF5E1">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
